server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Un index.html mis en cache pointe vers d'anciens bundles hashés.
    # Sans ce header, Firefox demande un .js disparu, reçoit du HTML (try_files)
    # et refuse le module — parfois signalé comme CSP « script-src 'none' ».
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        expires off;
    }

    location = /theme-boot.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }

    # Jamais de repli SPA sur les assets : un .js manquant doit être un 404,
    # pas index.html servi en text/html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
