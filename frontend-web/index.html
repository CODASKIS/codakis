<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-simple.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Nunito:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: #fff;
        font-family: Nunito, system-ui, sans-serif;
      }

      html {
        font-size: 16px;
      }

      .codakis-boot {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 32px;
      }

      .codakis-boot__logo {
        width: 48px;
        height: 48px;
        min-width: 48px;
        min-height: 48px;
        flex-shrink: 0;
        object-fit: contain;
      }

      .codakis-boot__logo--spin {
        animation: codakis-spin 1.1s linear infinite;
      }

      .codakis-boot__text {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
      }

      @keyframes codakis-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .codakis-boot__logo--spin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="codakis-boot" role="status" aria-live="polite" aria-busy="true">
        <img
          class="codakis-boot__logo codakis-boot__logo--spin"
          src="/images/logo-simple.png"
          alt=""
          width="48"
          height="48"
        />
        <p class="codakis-boot__text">Chargement…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
