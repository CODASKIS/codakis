# CODAKIS — déploiement web (PostgreSQL + API + portail)
#
# Démarrage :
#   cp .env.example .env   # puis éditer POSTGRES_PASSWORD et SECRET_KEY
#   docker compose up -d --build
#   → http://localhost:${WEB_PORT:-8080}

name: codakis

services:
  postgres:
    image: postgres:16-alpine
    container_name: codakis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codakis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-codakis_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - codakis_internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codakis_api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-codakis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-codakis_db}
      SECRET_KEY: ${SECRET_KEY:?Définissez SECRET_KEY dans .env}
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CODAKIS}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@codakis.cm}
      SMTP_FALLBACK_HOST: ${SMTP_FALLBACK_HOST:-172.17.0.1}
      SMTP_FALLBACK_PORT: ${SMTP_FALLBACK_PORT:-25}
      CMS_UPLOAD_DIR: /app/uploads/cms
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_VOICE_ID_FR: ${ELEVENLABS_VOICE_ID_FR:-}
      ELEVENLABS_VOICE_ID_EN: ${ELEVENLABS_VOICE_ID_EN:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_CURRENCY: ${CINETPAY_CURRENCY:-XAF}
      PAYMENT_RETURN_BASE_URL: ${PAYMENT_RETURN_BASE_URL:-}
      PAWAPAY_TOKEN: ${PAWAPAY_TOKEN:-}
      PAWAPAY_SANDBOX: ${PAWAPAY_SANDBOX:-true}
      PAWAPAY_CUSTOMER_MESSAGE: ${PAWAPAY_CUSTOMER_MESSAGE:-CODAKIS}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    volumes:
      - cms_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - codakis_internal
      - efy_network

  web:
    build:
      context: .
      dockerfile: frontend-web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: codakis_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - codakis_internal
      - efy_network

networks:
  codakis_internal:
  efy_network:
    external: true
    name: efy_network

volumes:
  postgres_data:
  cms_uploads:
