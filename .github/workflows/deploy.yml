name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: codakis-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer sur 194.163.171.109
    runs-on: ubuntu-latest
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 194.163.171.109
          username: root
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            if [[ ! -d /root/codakis/.git ]]; then
              git clone https://github.com/CODASKIS/codakis.git /root/codakis
            fi
            cd /root/codakis
            # Pull before invoking deploy.sh so the running script is never
            # rewritten mid-execution (that skipped the health check → false green).
            git fetch --depth 1 origin main
            git reset --hard origin/main
            CODAKIS_SKIP_GIT_PULL=1 ./scripts/deploy.sh
